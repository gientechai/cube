# Local 3-node Cube Store HA stack (MinIO + haproxy).
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#
# Old single-node reference (068abb51…): ./cubestored, port 3030, no extra env.
# HA adds rocksdb-raft + shared S3; query endpoint stays cubestore-lb:3030.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cubestore
      MINIO_ROOT_PASSWORD: cubestore123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cubestore cubestore123 &&
      mc mb --ignore-existing local/cubestore &&
      echo 'bucket cubestore ready'
      "

  cubestore-n1:
    depends_on:
      minio-init:
        condition: service_completed_successfully

  cubestore-n2:
    depends_on:
      minio-init:
        condition: service_completed_successfully

  cubestore-n3:
    depends_on:
      minio-init:
        condition: service_completed_successfully

  cubestore-lb:
    depends_on:
      - cubestore-n1
      - cubestore-n2
      - cubestore-n3

volumes:
  minio-data:
