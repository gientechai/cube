      - traefik.http.routers.chat-agent-${PROFILE}.entrypoints=websecure
      - traefik.http.routers.chat-agent-${PROFILE}.service=chat-agent-${PROFILE}
      - traefik.http.routers.chat-agent-${PROFILE}.tls.certresolver=resolver
