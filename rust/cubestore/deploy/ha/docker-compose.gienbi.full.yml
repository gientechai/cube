      - CUBEJS_API_SECRET=HfkjksFKLJISJFKLFKWJFQFIQWIOFJQOFFQGGSDGFFJIQOEUFIEJFIOQWEFHFQOK5FKOIQWUFFEFE423FIQEOFJHUEWHFKASKDLQWJIFSJDJKFHJIJWO
      - DOMAIN_ID=1ed126f819c04cf19b391613254e37f6
