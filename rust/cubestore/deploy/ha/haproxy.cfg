# Cube Store HA — haproxy fronting the 3-node rocksdb-raft cluster (v4 §5).
# HTTP/Ws pass-through; liveness via the status-probe /readyz on :3031.
# Readiness deliberately does NOT require Raft leadership (sub-second
# election windows must not pull every router out of the LB).

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60m
    timeout server 60m
    timeout tunnel 60m

listen cubestore-http
    bind *:3030
    balance roundrobin
    # Fail fast on dead backends; 1s checks, down after 2 misses, up after 2.
    option httpchk GET /readyz
    default-server inter 1s fall 2 rise 2
    server n1 cubestore-n1:3030 check port 3031
    server n2 cubestore-n2:3030 check port 3031
    server n3 cubestore-n3:3030 check port 3031

listen stats
    bind *:9600
    stats enable
    stats uri /stats
