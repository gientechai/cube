name: cubestore-ha-image

# Build the HA cubestore image (rust/cubestore/Dockerfile, context ./rust/)
# and push it to ghcr.io. This is the image deploy/ha/docker-compose.yml
# consumes (CUBESTORE_IMAGE). Mirrors the cubestore job in publish.yml
# (same context/file/build-args) but for the HA PoC branch.

on:
  push:
    branches: [feature/openraft-metastore-poc]
    paths:
      - "rust/cubestore/**"
      - ".github/workflows/ha-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-cubestore

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ha-poc
            type=sha,prefix=ha-poc-

      - uses: docker/build-push-action@v6
        with:
          context: ./rust/
          file: ./rust/cubestore/Dockerfile
          platforms: ${{ matrix.platform }}
          # arm64 runners/qemu cannot use AVX2
          build-args: |
            ${{ matrix.platform == 'linux/arm64' && 'WITH_AVX2=0' || 'WITH_AVX2=1' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
